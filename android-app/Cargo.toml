[package]
name = "cits-map"
version = "0.1.0"
edition = "2024"

[features]
default = []
ui = ["dep:dioxus"]
mobile = ["ui", "dioxus/mobile"]
desktop = ["ui", "dioxus/desktop"]

[[bin]]
name = "cits-map"
path = "src/main.rs"
required-features = ["ui"]

[dependencies]
c-its-parser = { version = "=2.4.2", default-features = false, features = ["std", "cam", "denm"] }
dioxus = { version = "=0.7.10", default-features = false, features = ["launch", "macro", "html", "signals", "hooks", "document", "asset"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "macros", "sync", "net"] }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk-context = "0.1.1"

[profile.release]
opt-level = "s"
strip = true
